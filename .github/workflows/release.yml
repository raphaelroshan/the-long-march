name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-candidate:
    name: ${{ matrix.name }} release candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
            artifact: windows-playtest
          - name: macOS
            os: macos-latest
            target: macos
            artifact: macos-playtest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Run deterministic tests
        run: bash scripts/verify.sh
      - name: Require export presets for release builds
        run: test -f export_presets.cfg
      - name: Export desktop playtest
        run: bash scripts/export_playtest.sh "${{ matrix.target }}"
      - name: Create release manifest
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python -c "import json, os; m=json.load(open('tools/ci_manifest.json')); m.update({'commit': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF']}); json.dump(m, open('artifacts/release_manifest.json','w'), indent=2)"
          tar --exclude=.git --exclude=.godot --exclude=artifacts --exclude=build -czf "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" .
      - name: Upload desktop release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            build/
            artifacts/
          if-no-files-found: error
          retention-days: 90
