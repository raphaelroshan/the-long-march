name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-candidate:
    name: ${{ matrix.name }} release candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: windows
            artifact: windows-playtest
          - name: macOS
            os: macos-latest
            target: macos
            artifact: macos-playtest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Run deterministic tests
        run: bash scripts/verify.sh
      - name: Require export presets for release builds
        run: test -f export_presets.cfg
      - name: Export desktop playtest
        run: LONG_MARCH_SKIP_IMPORT=1 bash scripts/export_playtest.sh "${{ matrix.target }}"
      - name: Smoke packaged desktop build
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            package="build/the-long-march-windows.exe"
          else
            package="build/the-long-march-macos.zip"
          fi
          python tools/smoke_playtest.py --platform "${{ matrix.target }}" --package "$package"
      - name: Create release manifest
        run: |
          mkdir -p artifacts
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          tar --exclude=.git --exclude=.godot --exclude=artifacts --exclude=build -czf "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" .
          if [ "${{ matrix.target }}" = "windows" ]; then
            package="build/the-long-march-windows.exe"
          else
            package="build/the-long-march-macos.zip"
          fi
          python tools/create_release_manifest.py \
            --root . \
            --output artifacts/release_manifest.json \
            --commit "$GITHUB_SHA" \
            --head-commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --platform "${{ matrix.target }}" \
            --engine-version "$(godot --version | head -n 1)" \
            --verification deterministic_tests \
            --verification "${{ matrix.target }}_export" \
            --verification "${{ matrix.target }}_packaged_smoke" \
            --verification offline_boundary \
            --verification performance_budget \
            --file desktop_package="$package" \
            --file source_snapshot="artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" \
            --file observer_brief=docs/playtest_guide.md \
            --file session_sheet=docs/private_alpha_session_sheet.md \
            --file session_preparer=tools/prepare_playtest_session.py \
            --file report_output=tools/report_output.py \
            --file session_summarizer=tools/summarize_playtest_feedback.py \
            --file cohort_summarizer=tools/summarize_playtest_cohort.py \
            --file scope_and_limitations=docs/internal_test_release.md \
            --file manifest_verifier=tools/verify_release_manifest.py
      - name: Verify exact cohort manifest
        run: python tools/verify_release_manifest.py artifacts/release_manifest.json
      - name: Upload desktop release candidate
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            build/
            artifacts/
            docs/internal_test_release.md
            docs/playtest_guide.md
            docs/private_alpha_session_sheet.md
            tools/prepare_playtest_session.py
            tools/report_output.py
            tools/summarize_playtest_feedback.py
            tools/summarize_playtest_cohort.py
            tools/verify_release_manifest.py
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified prerelease
    needs: release-candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Download Windows cohort
        uses: actions/download-artifact@v7
        with:
          name: windows-playtest-${{ github.ref_name }}
          path: staging/windows
      - name: Download macOS cohort
        uses: actions/download-artifact@v7
        with:
          name: macos-playtest-${{ github.ref_name }}
          path: staging/macos
      - name: Verify downloaded cohorts and session preflight
        run: |
          python staging/windows/tools/verify_release_manifest.py staging/windows/artifacts/release_manifest.json
          python staging/macos/tools/verify_release_manifest.py staging/macos/artifacts/release_manifest.json
          python staging/windows/tools/prepare_playtest_session.py staging/windows/artifacts/release_manifest.json --session 1 --output "$RUNNER_TEMP/windows-session.md"
          python staging/macos/tools/prepare_playtest_session.py staging/macos/artifacts/release_manifest.json --session 1 --output "$RUNNER_TEMP/macos-session.md"
      - name: Assemble public release assets
        run: |
          version="$GITHUB_REF_NAME"
          mkdir -p release
          cp staging/windows/build/the-long-march-windows.exe "release/The-Long-March-${version}-Windows.exe"
          cp staging/macos/build/the-long-march-macos.zip "release/The-Long-March-${version}-macOS.zip"
          (cd staging/windows && zip -qr "$GITHUB_WORKSPACE/release/The-Long-March-${version}-Windows-Cohort.zip" .)
          (cd staging/macos && zip -qr "$GITHUB_WORKSPACE/release/The-Long-March-${version}-macOS-Cohort.zip" .)
          unzip -tq "release/The-Long-March-${version}-Windows-Cohort.zip"
          unzip -tq "release/The-Long-March-${version}-macOS-Cohort.zip"
          unzip -tq "release/The-Long-March-${version}-macOS.zip"
          (cd release && sha256sum The-Long-March-* > SHA256SUMS.txt)
      - name: Prepare tester-facing release notes
        run: |
          python tools/render_release_notes.py \
            --tag "$GITHUB_REF_NAME" \
            --workflow-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Create or refresh GitHub prerelease
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --prerelease --title "The Long March ${tag}"
          else
            notes="$(cat "$RUNNER_TEMP/release-notes.md")"
            gh release create "$tag" release/* --verify-tag --prerelease --generate-notes --notes "$notes" --title "The Long March ${tag}"
          fi
