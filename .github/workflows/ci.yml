name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Policy checks
        run: python tools/policy_check.py --repo "${GITHUB_REPOSITORY}"
      - name: Validate content manifest
        run: python tools/validate_content.py --manifest content/content_manifest.json
      - name: Validate gameplay framework
        run: python tools/validate_gameplay_framework.py --data content/gameplay_framework.json
      - name: Validate Flooded Veyru chapter
        run: python tools/validate_flooded_veyru.py --data content/flooded_veyru.json
      - name: Validate build versions
        run: python tools/validate_versions.py --repo .
      - name: Verify offline runtime boundary
        run: python tools/verify_offline_boundary.py --repo .
      - name: Verify private-alpha gate contract
        run: python tests/test_private_alpha_contract.py

  tests:
    name: Verification (${{ matrix.os }} / ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            group: static
          - os: ubuntu-latest
            group: core
          - os: ubuntu-latest
            group: presentation
          - os: ubuntu-latest
            group: journey
          - os: ubuntu-latest
            group: regional
          - os: windows-latest
            group: core
          - os: windows-latest
            group: presentation
          - os: windows-latest
            group: journey
          - os: windows-latest
            group: regional
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        if: matrix.group != 'static'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Verify Godot
        if: matrix.group != 'static'
        run: godot --version
      - name: Run deterministic tests
        run: bash scripts/verify.sh "${{ matrix.group }}"

  agent-qa:
    name: Agent QA complete journey
    runs-on: ubuntu-latest
    needs: [policy, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Run semantic journey and capture evidence
        env:
          AGENT_QA_GAME: the-long-march
          AGENT_QA_OUTPUT_DIR: artifacts/agent-qa
          GODOT_BIN: godot
        run: bash scripts/agent_qa.sh
      - name: Upload agent QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-qa-the-long-march-${{ github.run_number }}
          path: artifacts/agent-qa/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  ai-review:
    name: Multi-agent AI review
    runs-on: ubuntu-latest
    if: always()
    needs: [policy, tests]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_REVIEW_MODELS: ${{ vars.AI_REVIEW_MODELS || 'gpt-5-mini' }}
      AI_REVIEW_REQUIRED: ${{ vars.AI_REVIEW_REQUIRED || 'false' }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install AI client when enabled
        if: env.OPENAI_API_KEY != ''
        run: python -m pip install --disable-pip-version-check "openai>=1,<2"
      - name: Build review diff
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p artifacts
          base="$PR_BASE"
          if [ -z "$base" ] || ! git rev-parse "$base^{commit}" >/dev/null 2>&1; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --no-ext-diff "$base" HEAD > artifacts/change.diff
          echo "Reviewing diff from $base to HEAD"
      - name: Run independent reviewers
        run: |
          python tools/ai_review_runner.py \
            --diff artifacts/change.diff \
            --repo "${GITHUB_REPOSITORY}" \
            --contract ci/quality_contract.md \
            --output artifacts/ai_review.json \
            --fail-on critical
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package release candidate
    runs-on: windows-latest
    needs: [policy, tests, agent-qa, ai-review]
    if: needs.policy.result == 'success' && needs.tests.result == 'success' && needs.agent-qa.result == 'success' && needs.ai-review.result != 'failure'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Download agent QA evidence
        uses: actions/download-artifact@v7
        with:
          name: agent-qa-the-long-march-${{ github.run_number }}
          path: artifacts/agent-qa
      - name: Import and validate project
        run: godot --headless --path . --editor --quit
      - name: Export Windows build when presets exist
        run: |
          mkdir -p build artifacts
          if [ -f export_presets.cfg ]; then
            LONG_MARCH_SKIP_IMPORT=1 bash scripts/export_playtest.sh windows
          else
            echo "No export_presets.cfg yet; packaging source and test evidence only."
          fi
      - name: Smoke packaged Windows build
        run: python tools/smoke_playtest.py --platform windows --package build/the-long-march-windows.exe
      - name: Package source snapshot
        run: |
          mkdir -p artifacts
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          tar --exclude=.git --exclude=.godot --exclude=artifacts --exclude=build -czf "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" .
      - name: Create exact cohort manifest
        env:
          COHORT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python tools/create_release_manifest.py \
            --root . \
            --output artifacts/release_manifest.json \
            --commit "$GITHUB_SHA" \
            --head-commit "$COHORT_HEAD_SHA" \
            --ref "$GITHUB_REF" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --platform windows \
            --engine-version "$(godot --version | head -n 1)" \
            --verification repository_policy \
            --verification godot_tests_ubuntu \
            --verification godot_tests_windows \
            --verification ai_review \
            --verification agent_qa_complete_journey \
            --verification windows_export \
            --verification windows_packaged_smoke \
            --verification offline_boundary \
            --verification performance_budget \
            --file desktop_package=build/the-long-march-windows.exe \
            --file source_snapshot="artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" \
            --file observer_brief=docs/playtest_guide.md \
            --file session_sheet=docs/private_alpha_session_sheet.md \
            --file session_preparer=tools/prepare_playtest_session.py \
            --file session_finalizer=tools/finalize_playtest_session.py \
            --file report_output=tools/report_output.py \
            --file session_summarizer=tools/summarize_playtest_feedback.py \
            --file cohort_summarizer=tools/summarize_playtest_cohort.py \
            --file packet_cohort_summarizer=tools/summarize_playtest_packets.py \
            --file evidence_workflow_smoke=tools/smoke_playtest_evidence.py \
            --file scope_and_limitations=docs/internal_test_release.md \
            --file early_access_candidate=docs/early_access_candidate.md \
            --file early_access_known_limitations=docs/early_access_known_limitations.md \
            --file early_access_test_matrix=docs/early_access_test_matrix.md \
            --file campaign_contract=content/early_access_candidate.json \
            --file gpt56_execution=docs/lm_gpt56_5_early_access_package_report.md \
            --file agent_qa_result=artifacts/agent-qa/qa-result.json \
            --file agent_qa_capture_manifest=artifacts/agent-qa/journey-capture/capture-manifest.json \
            --file manifest_verifier=tools/verify_release_manifest.py
      - name: Verify exact cohort manifest
        run: python tools/verify_release_manifest.py artifacts/release_manifest.json
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_number }}
          path: |
            build/
            artifacts/
            docs/internal_test_release.md
            docs/early_access_candidate.md
            docs/early_access_known_limitations.md
            docs/early_access_test_matrix.md
            docs/lm_gpt56_5_early_access_package_report.md
            content/early_access_candidate.json
            docs/playtest_guide.md
            docs/private_alpha_session_sheet.md
            tools/prepare_playtest_session.py
            tools/finalize_playtest_session.py
            tools/report_output.py
            tools/summarize_playtest_feedback.py
            tools/summarize_playtest_cohort.py
            tools/summarize_playtest_packets.py
            tools/smoke_playtest_evidence.py
            tools/verify_release_manifest.py
          if-no-files-found: error
          retention-days: 30

  verify-package:
    name: Verify downloaded release candidate
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download exact release candidate
        uses: actions/download-artifact@v7
        with:
          name: release-candidate-${{ github.run_number }}
          path: staging/candidate
      - name: Verify downloaded cohort and complete evidence workflow
        run: |
          python staging/candidate/tools/verify_release_manifest.py staging/candidate/artifacts/release_manifest.json
          python staging/candidate/tools/smoke_playtest_evidence.py staging/candidate/artifacts/release_manifest.json --output "$RUNNER_TEMP/pr-evidence-smoke"

  package-linux:
    name: Package Linux release candidate
    runs-on: ubuntu-latest
    needs: [policy, tests, agent-qa, ai-review]
    if: needs.policy.result == 'success' && needs.tests.result == 'success' && needs.agent-qa.result == 'success' && needs.ai-review.result != 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Download agent QA evidence
        uses: actions/download-artifact@v7
        with:
          name: agent-qa-the-long-march-${{ github.run_number }}
          path: artifacts/agent-qa
      - name: Import and validate project
        run: godot --headless --path . --editor --quit
      - name: Export Linux build
        run: LONG_MARCH_SKIP_IMPORT=1 bash scripts/export_playtest.sh linux
      - name: Smoke packaged Linux build
        run: python tools/smoke_playtest.py --platform linux --package build/the-long-march-linux.x86_64
      - name: Package source snapshot
        run: |
          mkdir -p artifacts
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          tar --exclude=.git --exclude=.godot --exclude=artifacts --exclude=build -czf "artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" .
      - name: Create exact Linux cohort manifest
        env:
          COHORT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          slug=$(python -c "import json; print(json.load(open('tools/ci_manifest.json'))['slug'])")
          python tools/create_release_manifest.py \
            --root . \
            --output artifacts/release_manifest.json \
            --commit "$GITHUB_SHA" \
            --head-commit "$COHORT_HEAD_SHA" \
            --ref "$GITHUB_REF" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --platform linux \
            --engine-version "$(godot --version | head -n 1)" \
            --verification repository_policy \
            --verification godot_tests_ubuntu \
            --verification godot_tests_windows \
            --verification ai_review \
            --verification agent_qa_complete_journey \
            --verification linux_export \
            --verification linux_packaged_smoke \
            --verification offline_boundary \
            --verification performance_budget \
            --file desktop_package=build/the-long-march-linux.x86_64 \
            --file source_snapshot="artifacts/${slug}-source-${GITHUB_SHA}.tar.gz" \
            --file observer_brief=docs/playtest_guide.md \
            --file session_sheet=docs/private_alpha_session_sheet.md \
            --file session_preparer=tools/prepare_playtest_session.py \
            --file session_finalizer=tools/finalize_playtest_session.py \
            --file report_output=tools/report_output.py \
            --file session_summarizer=tools/summarize_playtest_feedback.py \
            --file cohort_summarizer=tools/summarize_playtest_cohort.py \
            --file packet_cohort_summarizer=tools/summarize_playtest_packets.py \
            --file evidence_workflow_smoke=tools/smoke_playtest_evidence.py \
            --file scope_and_limitations=docs/internal_test_release.md \
            --file early_access_candidate=docs/early_access_candidate.md \
            --file early_access_known_limitations=docs/early_access_known_limitations.md \
            --file early_access_test_matrix=docs/early_access_test_matrix.md \
            --file campaign_contract=content/early_access_candidate.json \
            --file gpt56_execution=docs/lm_gpt56_5_early_access_package_report.md \
            --file agent_qa_result=artifacts/agent-qa/qa-result.json \
            --file agent_qa_capture_manifest=artifacts/agent-qa/journey-capture/capture-manifest.json \
            --file manifest_verifier=tools/verify_release_manifest.py
      - name: Verify exact Linux cohort manifest
        run: python tools/verify_release_manifest.py artifacts/release_manifest.json
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-candidate-${{ github.run_number }}
          path: |
            build/
            artifacts/
            docs/internal_test_release.md
            docs/early_access_candidate.md
            docs/early_access_known_limitations.md
            docs/early_access_test_matrix.md
            docs/lm_gpt56_5_early_access_package_report.md
            content/early_access_candidate.json
            docs/playtest_guide.md
            docs/private_alpha_session_sheet.md
            tools/prepare_playtest_session.py
            tools/finalize_playtest_session.py
            tools/report_output.py
            tools/summarize_playtest_feedback.py
            tools/summarize_playtest_cohort.py
            tools/summarize_playtest_packets.py
            tools/smoke_playtest_evidence.py
            tools/verify_release_manifest.py
          if-no-files-found: error
          retention-days: 30

  verify-linux-package:
    name: Verify downloaded Linux candidate
    runs-on: ubuntu-latest
    needs: package-linux
    steps:
      - name: Download exact Linux release candidate
        uses: actions/download-artifact@v7
        with:
          name: linux-release-candidate-${{ github.run_number }}
          path: staging/linux-candidate
      - name: Verify downloaded Linux cohort and complete evidence workflow
        run: |
          python staging/linux-candidate/tools/verify_release_manifest.py staging/linux-candidate/artifacts/release_manifest.json
          python staging/linux-candidate/tools/smoke_playtest_evidence.py staging/linux-candidate/artifacts/release_manifest.json --output "$RUNNER_TEMP/linux-pr-evidence-smoke"
